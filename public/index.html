<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TECNOINCUBADORA AI — Teste de Busca</title>
<style>
  :root {
    --azul: #0f4c81; --azul-claro: #e8f1fa; --verde: #0e8a5f;
    --cinza: #64748b; --borda: #e2e8f0; --fundo: #f8fafc; --vermelho: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--fundo); color: #1e293b; min-height: 100vh; }
  header { background: var(--azul); color: #fff; padding: 20px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  header .pill { background: rgba(255,255,255,.15); border-radius: 999px; padding: 4px 12px; font-size: .75rem; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  .busca-box { background: #fff; border: 1px solid var(--borda); border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .busca-box label { font-size: .85rem; color: var(--cinza); display: block; margin-bottom: 8px; }
  .linha { display: flex; gap: 10px; }
  .linha input { flex: 1; padding: 13px 16px; border: 1.5px solid var(--borda); border-radius: 10px; font-size: 1rem; outline: none; }
  .linha input:focus { border-color: var(--azul); }
  .linha button { background: var(--azul); color: #fff; border: 0; border-radius: 10px; padding: 0 26px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .linha button:hover { background: #0d3f6b; }
  .linha button:disabled { opacity: .6; cursor: wait; }
  .exemplos { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .exemplos button { background: var(--azul-claro); color: var(--azul); border: 0; border-radius: 999px; padding: 6px 14px; font-size: .8rem; cursor: pointer; }
  .exemplos button:hover { background: #d3e4f5; }
  #estado { margin: 14px 2px; font-size: .9rem; color: var(--cinza); min-height: 20px; }
  #estado.erro { color: var(--vermelho); }
  .resultados { display: grid; gap: 10px; }
  .cartao { background: #fff; border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .cartao:hover { border-color: var(--azul); box-shadow: 0 2px 8px rgba(15,76,129,.12); }
  .cartao .nome { font-weight: 600; font-size: 1rem; }
  .cartao .generico { color: var(--cinza); font-size: .85rem; margin-top: 2px; }
  .cartao .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: .7rem; border-radius: 5px; padding: 3px 8px; background: var(--azul-claro); color: var(--azul); }
  .tag.receita { background: #fef3c7; color: #92400e; }
  .tag.relevancia { background: #dcfce7; color: var(--verde); }
  .detalhe { background: #fff; border: 1px solid var(--borda); border-radius: 14px; padding: 22px; }
  .detalhe h2 { font-size: 1.15rem; margin-bottom: 4px; }
  .detalhe .sub { color: var(--cinza); font-size: .9rem; margin-bottom: 16px; }
  .detalhe table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .detalhe td { padding: 7px 10px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  .detalhe td:first-child { color: var(--cinza); width: 180px; }
  .voltar { margin-top: 16px; background: none; border: 1.5px solid var(--borda); border-radius: 10px; padding: 9px 18px; cursor: pointer; font-size: .9rem; color: var(--azul); font-weight: 600; }
  .voltar:hover { border-color: var(--azul); }
  .sem-estoque { color: var(--vermelho); font-weight: 600; }
  .vazio { text-align: center; color: var(--cinza); padding: 40px 0; }
  footer { text-align: center; color: var(--cinza); font-size: .78rem; padding: 24px; }
</style>
</head>
<body>
<header>
  <h1>💊 TECNOINCUBADORA AI</h1>
  <span class="pill">Módulo GestorFarma — ambiente de teste</span>
</header>
<main>
  <div class="busca-box">
    <label for="q">Escreve como se fosses um cliente: frases naturais, com ou sem acentos, mesmo com erros de digitação</label>
    <div class="linha">
      <input id="q" placeholder="Ex: quero comprar paracetamol" autofocus>
      <button id="btn" onclick="buscar()">Buscar</button>
    </div>
    <div class="exemplos" id="exemplos"></div>
  </div>
  <div id="estado"></div>
  <div id="resultados" class="resultados"></div>
</main>
<footer>TECNOINCUBADORA AI · POST /api/farmacia/buscar · GET /api/farmacia/produto/:id</footer>

<script>
const EXEMPLOS = [
  'quero lista de produtos',
  'preciso comprar paracetamol',
  'amoxilina',            // erro de digitação de amoxicilina
  'tem Doril? preço',     // acento e ruído
  '8906044712959'         // código de barras
];
const elQ = document.getElementById('q');
const elBtn = document.getElementById('btn');
const elEstado = document.getElementById('estado');
const elResultados = document.getElementById('resultados');

EXEMPLOS.forEach(txt => {
  const b = document.createElement('button');
  b.textContent = '“' + txt + '”';
  b.onclick = () => { elQ.value = txt; buscar(); };
  document.getElementById('exemplos').appendChild(b);
});

elQ.addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });

async function buscar() {
  const query = elQ.value.trim();
  if (!query) return;
  elBtn.disabled = true;
  elEstado.className = '';
  elEstado.textContent = 'A buscar…';
  elResultados.innerHTML = '';
  try {
    const r = await fetch('/api/farmacia/buscar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });
    const dados = await r.json();
    if (!r.ok) throw new Error(dados.error || 'Erro na busca');
    elEstado.textContent = dados.total === 0
      ? 'Nenhum produto encontrado para “' + query + '”.'
      : dados.total + ' resultado(s) para “' + query + '” — toca num produto para ver o estoque:';
    dados.resultados.forEach(p => {
      const c = document.createElement('div');
      c.className = 'cartao';
      c.innerHTML = `
        <div class="nome">${esc(p.nome)}</div>
        <div class="generico">${esc(p.nome_generico || '')}</div>
        <div class="tags">
          ${p.codigo_barras ? `<span class="tag">${esc(p.codigo_barras)}</span>` : ''}
          ${p.requer_receita ? '<span class="tag receita">Requer receita</span>' : ''}
          <span class="tag relevancia">Relevância ${p.relevancia}</span>
        </div>`;
      c.onclick = () => verProduto(p.id, p.nome);
      elResultados.appendChild(c);
    });
    if (dados.total === 0) elResultados.innerHTML = '<div class="vazio">🙈 Tenta escrever o nome do medicamento de outra forma.</div>';
  } catch (err) {
    elEstado.className = 'erro';
    elEstado.textContent = 'Erro: ' + err.message;
  } finally {
    elBtn.disabled = false;
  }
}

async function verProduto(id, nome) {
  elEstado.textContent = 'A carregar ' + nome + '…';
  elResultados.innerHTML = '';
  const r = await fetch('/api/farmacia/produto/' + id);
  const p = await r.json();
  elEstado.textContent = '';
  const linhas = [
    ['Nome genérico', p.nome_generico],
    ['Tipo', p.tipo],
    ['Concentração', p.concentracao],
    ['Forma farmacêutica', p.forma_farmaceutica],
    ['Composição', p.composicao],
    ['Indicação', p.indicacao],
    ['Código de barras', p.codigo_barras],
    ['Requer receita', p.requer_receita ? 'Sim' : 'Não'],
    ['IVA', p.taxa_iva ? p.taxa_iva + '%' : '']
  ].filter(l => l[1] !== '' && l[1] != null);

  let estoqueHtml = '';
  if (p.estoque && p.estoque.length) {
    estoqueHtml = p.estoque.map(e => `
      <tr><td>Preço</td><td><strong>${e.preco_venda} MZN</strong>${e.em_promocao && e.preco_promocional ? ' (promoção: ' + e.preco_promocional + ' MZN)' : ''}</td></tr>
      <tr><td>Quantidade em estoque</td><td class="${e.quantidade == 0 ? 'sem-estoque' : ''}">${e.quantidade}</td></tr>
      <tr><td>Lote / Validade</td><td>${e.lote || '—'} / ${e.data_validade ? e.data_validade.slice(0, 10) : '—'}</td></tr>
    `).join('');
  } else {
    estoqueHtml = '<tr><td>Estoque</td><td class="sem-estoque">Sem estoque disponível</td></tr>';
  }

  elResultados.innerHTML = `
    <div class="detalhe">
      <h2>${esc(p.nome)}</h2>
      <div class="sub">Produto #${p.id}</div>
      <table>${linhas.map(l => `<tr><td>${l[0]}</td><td>${esc(String(l[1]))}</td></tr>`).join('')}${estoqueHtml}</table>
      <button class="voltar" onclick="voltar()">← Voltar aos resultados</button>
    </div>`;
  window._ultimoResultado = true;
}

function voltar() { elResultados.innerHTML = ''; window._ultimoResultado && buscar(); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
